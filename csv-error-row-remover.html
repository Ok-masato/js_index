<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSV エラー行除去</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/encoding-japanese/2.0.0/encoding.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="cafe-common.css" />
    <style>
      input[type="file"] { display: none; }
    </style>
  </head>
  <body>
    <div class="page-header">
      <h1 class="page-header__title">CSV エラー行除去</h1>
      <p class="page-header__subtitle">エラーメッセージから該当行を自動削除</p>
      <div class="page-header__divider"></div>
    </div>

    <div class="container">
      <div class="info-box">
        <strong>使い方：</strong>
        CSV ファイルを選択し、エラーメッセージを貼り付けてください。ヘッダー行の有無によって行番号の解釈が変わります。
      </div>

      <div class="card-section">
        <div class="section-title">1. CSV ファイルを選択</div>

        <input type="file" id="csvFile" accept=".csv" />
        <label for="csvFile" class="file-input-label" id="fileLabel">
          <div style="font-size:2rem; margin-bottom:8px; opacity:0.5;">↑</div>
          <div style="font-weight:400;">クリックして CSV ファイルを選択</div>
          <div style="font-size:0.75rem; color:var(--muted); margin-top:6px;">またはドラッグ&ドロップ</div>
        </label>

        <div style="margin-top:16px;">
          <label style="margin-bottom:10px;">ヘッダー行の有無</label>
          <div class="radio-group" style="flex-direction:column; gap:10px;">
            <label>
              <input type="radio" name="headerOption" value="withHeader" checked />
              <span><strong style="font-weight:500;">ヘッダー行あり</strong> — エラーの行番号はデータ行の番号</span>
            </label>
            <label>
              <input type="radio" name="headerOption" value="withoutHeader" />
              <span><strong style="font-weight:500;">ヘッダー行なし</strong> — エラーの行番号はファイル先頭からの番号</span>
            </label>
          </div>
        </div>
      </div>

      <div class="card-section">
        <div class="section-title">2. エラーメッセージを貼り付け</div>
        <textarea id="errorMessages" placeholder="エラーメッセージをここに貼り付けてください&#10;例:&#10;* 必須入力項目です。 (メルマガ配信用メールホスト) (197行目)&#10;* 必須入力項目です。 (メッセージカード シーンリスト) (853行目)"></textarea>
      </div>

      <div class="card-section">
        <button class="btn-primary" id="processBtn" disabled style="margin-top:0;">エラー行を削除して新しい CSV を作成</button>
      </div>

      <div id="result"></div>
    </div>

    <script>
      let originalCsvText = "";
      let csvRowRanges = null;
      let detectedEncoding = null;
      let originalFileName = "";
      let totalRows = 0;

      const fileInput = document.getElementById("csvFile");
      const fileLabel = document.getElementById("fileLabel");
      const errorMessages = document.getElementById("errorMessages");
      const processBtn = document.getElementById("processBtn");
      const result = document.getElementById("result");

      fileInput.addEventListener("change", handleFileSelect);

      fileLabel.addEventListener("dragover", (e) => {
        e.preventDefault();
        fileLabel.style.borderColor = "var(--caramel)";
      });
      fileLabel.addEventListener("dragleave", () => {
        if (!csvRowRanges) fileLabel.style.borderColor = "";
      });
      fileLabel.addEventListener("drop", (e) => {
        e.preventDefault();
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          fileInput.files = files;
          handleFileSelect();
        }
      });

      function handleFileSelect() {
        const file = fileInput.files[0];
        if (!file) return;
        originalFileName = file.name;

        const reader = new FileReader();
        reader.onload = function (e) {
          const arrayBuffer = e.target.result;
          const bytes = new Uint8Array(arrayBuffer);
          detectedEncoding = Encoding.detect(bytes);
          const unicodeArray = Encoding.convert(bytes, { to: "UNICODE", from: detectedEncoding });
          originalCsvText = Encoding.codeToString(unicodeArray);

          Papa.parse(originalCsvText, {
            skipEmptyLines: false,
            complete: function (results) {
              totalRows = results.data.length;
              csvRowRanges = extractCsvRows(originalCsvText, results.data);

              fileLabel.classList.add("has-file");
              fileLabel.innerHTML = `
                <div style="font-size:1.5rem; margin-bottom:8px;">✓</div>
                <div style="font-weight:500;">${file.name}</div>
                <div style="font-size:0.75rem; color:var(--muted); margin-top:6px;">
                  ${totalRows} 行（ヘッダー含む）| データ: ${totalRows - 1} 行 | ${detectedEncoding}
                </div>
              `;
              checkEnableButton();
            },
          });
        };
        reader.readAsArrayBuffer(file);
      }

      errorMessages.addEventListener("input", checkEnableButton);
      function checkEnableButton() {
        processBtn.disabled = !(csvRowRanges && errorMessages.value.trim());
      }

      function extractCsvRows(text, parsedData) {
        const rows = [];
        let pos = 0;
        for (let i = 0; i < parsedData.length; i++) {
          let idx = pos;
          let inQuotes = false;
          let foundEnd = -1;

          while (idx < text.length) {
            const char = text[idx];
            if (char === '"') {
              if (idx + 1 < text.length && text[idx + 1] === '"') { idx += 2; continue; }
              inQuotes = !inQuotes;
            } else if (!inQuotes && (char === "\n" || char === "\r")) {
              foundEnd = (char === "\r" && idx + 1 < text.length && text[idx + 1] === "\n") ? idx + 2 : idx + 1;
              break;
            }
            idx++;
          }

          if (foundEnd === -1) foundEnd = text.length;
          rows.push({ start: pos, end: foundEnd });
          pos = foundEnd;
        }
        return rows;
      }

      processBtn.addEventListener("click", processCSV);

      function processCSV() {
        const errorText = errorMessages.value;
        const rowNumbers = extractRowNumbers(errorText);

        if (rowNumbers.length === 0) {
          result.innerHTML = `<div class="error-box"><strong>エラー:</strong> エラーメッセージから行番号を抽出できませんでした。</div>`;
          return;
        }

        const hasHeader = document.querySelector('input[name="headerOption"]:checked').value === "withHeader";
        const rowsToDelete = new Set(rowNumbers.map(n => hasHeader ? n : n - 1));
        const originalDataRows = hasHeader ? totalRows - 1 : totalRows;

        const segments = [];
        for (let i = 0; i < csvRowRanges.length; i++) {
          if (!rowsToDelete.has(i)) {
            const range = csvRowRanges[i];
            segments.push(originalCsvText.substring(range.start, range.end));
          }
        }

        const newCsvText = segments.join("");
        const unicodeArray = Encoding.stringToCode(newCsvText);
        const encodedArray = Encoding.convert(unicodeArray, { to: detectedEncoding, from: "UNICODE" });
        const uint8Array = new Uint8Array(encodedArray);

        const blob = new Blob([uint8Array], { type: "text/csv" });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", `${originalFileName.replace(/\.csv$/i, "")}_cleaned.csv`);
        link.style.visibility = "hidden";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        const newDataRows = originalDataRows - rowNumbers.length;

        result.innerHTML = `
          <div class="result-box">
            <strong>処理完了</strong> — 新しい CSV ファイルをダウンロードしました。
            <div class="stats-grid">
              <div class="stat-item">
                <div class="stat-value">${originalDataRows}</div>
                <div class="stat-label">元のデータ行数</div>
              </div>
              <div class="stat-item">
                <div class="stat-value">${rowNumbers.length}</div>
                <div class="stat-label">削除された行数</div>
              </div>
              <div class="stat-item">
                <div class="stat-value">${newDataRows}</div>
                <div class="stat-label">新しいデータ行数</div>
              </div>
            </div>
            <div style="margin-top:14px; font-size:0.78rem; color:var(--muted);">
              ${hasHeader ? "ヘッダー行あり" : "ヘッダー行なし"} | ${detectedEncoding} |
              削除行: ${Array.from(rowNumbers).sort((a, b) => a - b).join(", ")}
            </div>
          </div>
        `;
      }

      function extractRowNumbers(text) {
        const regex = /\((\d+)行目\)/g;
        const numbers = [];
        let match;
        while ((match = regex.exec(text)) !== null) {
          numbers.push(parseInt(match[1]));
        }
        return numbers;
      }
    </script>
  </body>
</html>
