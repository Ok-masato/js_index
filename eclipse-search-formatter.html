<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eclipse 検索整形</title>
    <link rel="stylesheet" href="cafe-common.css" />
    <style>
      #output { background: var(--input-bg); white-space: pre; overflow-x: auto; }
      .stats-bar {
        background: var(--success-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 16px;
        margin-bottom: 12px;
        font-size: 0.8rem;
        color: var(--success);
        display: none;
      }
      .warning-bar {
        background: var(--warning-bg);
        border-left: 3px solid var(--caramel);
        border-radius: 0 6px 6px 0;
        padding: 10px 16px;
        margin-bottom: 12px;
        font-size: 0.8rem;
        color: var(--coffee);
        display: none;
      }
      .example-box {
        background: var(--warning-bg);
        border-left: 3px solid var(--caramel);
        border-radius: 0 6px 6px 0;
        padding: 14px 18px;
        margin-bottom: 24px;
        font-size: 0.82rem;
        color: var(--coffee);
        line-height: 1.8;
      }
      .section-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      .section-header-label {
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .clear-btn {
        display: inline-flex;
        align-items: center;
        padding: 3px 10px;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--muted);
        font-size: 0.7rem;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
      }
      .clear-btn:hover { border-color: var(--error); color: var(--error); }
      .controls-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      select {
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--input-bg);
        color: var(--coffee);
        font-family: inherit;
        font-size: 0.83rem;
        outline: none;
      }
      select:focus { border-color: var(--caramel); }
      .check-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.83rem;
        color: var(--coffee);
        cursor: pointer;
        font-weight: 300;
      }
    </style>
  </head>
  <body>
    <nav class="page-nav">
      <a class="page-nav__back" href="index.html">Tools</a>
    </nav>

    <div class="page-header">
      <h1 class="page-header__title">Eclipse 検索整形</h1>
      <p class="page-header__subtitle">検索結果をツリー構造に整形</p>
      <div class="page-header__divider"></div>
    </div>

    <div class="container">
      <div class="example-box">
        <strong style="display:block; margin-bottom:6px;">使い方</strong>
        1. Eclipse で検索を実行（Ctrl+H）<br />
        2. 検索結果ビューの左上メニューから「Show as List」を選択<br />
        3. 全選択（Ctrl+A）してコピー → 下の「パス情報」に貼り付け<br />
        4. 「Show as Tree」でコピーした詳細は「詳細情報」に貼り付け（任意）<br />
        5. 「ツリー構造に整形」をクリック
      </div>

      <div class="card-section">
        <div class="section-header">
          <span class="section-header-label">パス情報（必須）</span>
          <button class="clear-btn" onclick="clearInput('pathInput')">✕ クリア</button>
        </div>
        <textarea id="pathInput" placeholder="例:
AdminMemberPointRecordInputBean.java - ebisu3/src/jp/co/interfactory/ebisu/command/admin/member (18 個の一致)
AdminOrderInputBaseBean.java - ebisu3/src/jp/co/interfactory/ebisu/command/admin/order (4 個の一致)"></textarea>
      </div>

      <div class="card-section">
        <div class="section-header">
          <span class="section-header-label">詳細情報（オプション）</span>
          <button class="clear-btn" onclick="clearInput('detailInput')">✕ クリア</button>
        </div>
        <textarea id="detailInput" placeholder="例:
AdminMemberPointRecordInputBean.java (18 個の一致)
131: setData(...
346: return ..."></textarea>
      </div>

      <div class="card-section">
        <div class="controls-row">
          <button class="btn-primary" style="width:auto; margin:0;" onclick="formatTree()">ツリー構造に整形</button>
          <button class="btn-secondary" onclick="copyOutput()">コピー</button>
          <button class="btn-secondary" onclick="clearAll()">全クリア</button>
          <label class="check-label" style="margin-left:auto;">
            インデント:
            <select id="indentType">
              <option value="space2">2 スペース</option>
              <option value="space4">4 スペース</option>
              <option value="tab">タブ</option>
            </select>
          </label>
          <label class="check-label">
            <input type="checkbox" id="showIcons" checked />
            アイコン
          </label>
        </div>
      </div>

      <div class="card-section">
        <div class="section-title">Output</div>
        <div id="statsBar" class="stats-bar"></div>
        <div id="warningBar" class="warning-bar"></div>
        <textarea id="output" class="output-field" style="min-height:260px;" readonly></textarea>
      </div>
    </div>

    <script>
      function formatTree() {
        const pathInput = document.getElementById("pathInput").value;
        const detailInput = document.getElementById("detailInput").value;
        const indentType = document.getElementById("indentType").value;
        const showIcons = document.getElementById("showIcons").checked;

        let indent = "  ";
        if (indentType === "space4") indent = "    ";
        if (indentType === "tab") indent = "\t";

        const pathLines = pathInput.split("\n");
        const fileInfoList = [];

        for (const line of pathLines) {
          if (!line.trim()) continue;
          const match = line.match(/^(.+?)\s+-\s+(.+?)(?:\s+\((\d+)\s*個の一致\))?$/);
          if (match) {
            const [, filename, path, matchCount] = match;
            fileInfoList.push({
              filename: filename.trim(),
              fullPath: path.trim() + "/" + filename.trim(),
              path: path.trim(),
              matchCount: matchCount ? parseInt(matchCount) : 0,
            });
          }
        }

        const detailList = [];

        if (detailInput.trim()) {
          const detailLines = detailInput.split("\n");
          let currentFilename = null;
          let currentMatches = [];
          let currentRootDir = null;

          for (const line of detailLines) {
            if (!line.trim()) continue;
            const content = line.trim();

            if (content.match(/^[\d,]+:/)) {
              if (currentFilename) currentMatches.push(content);
              continue;
            }

            if (content.match(/\.(java|xml|properties|jsp|js|css|html)(\s+\(|$)/i)) {
              if (currentFilename && currentMatches.length > 0) {
                detailList.push({ filename: currentFilename, matches: [...currentMatches], rootDir: currentRootDir });
              }
              const fileMatch = content.match(/^(.+?)\s+\((\d+)\s*個の一致\)$/);
              currentFilename = fileMatch ? fileMatch[1].trim() : content.split(/\s+/)[0];
              currentMatches = [];
              continue;
            }

            if (!line.match(/^\s/) && content.length > 0 && !content.match(/^[\d,]+:/)) {
              if (content.match(/^[A-Z_0-9]+$/)) currentRootDir = content;
            }
          }

          if (currentFilename && currentMatches.length > 0) {
            detailList.push({ filename: currentFilename, matches: [...currentMatches], rootDir: currentRootDir });
          }
        }

        const fileOrder = [];

        for (const fileInfo of fileInfoList) {
          let bestMatch = null;
          let bestMatchScore = -1;

          for (const detail of detailList) {
            if (detail.filename !== fileInfo.filename) continue;
            if (detail._used) continue;

            if (detail.rootDir) {
              const score = calculatePathSimilarity(fileInfo.path, detail.rootDir);
              if (score > bestMatchScore) { bestMatchScore = score; bestMatch = detail; }
            } else if (!bestMatch) {
              bestMatch = detail; bestMatchScore = 0;
            }
          }

          if (bestMatch) { bestMatch._used = true; }
          fileOrder.push({ ...fileInfo, matches: bestMatch ? bestMatch.matches : [] });
        }

        function calculatePathSimilarity(fullPath, rootDir) {
          const pathUpper = fullPath.toUpperCase();
          const rootUpper = rootDir.toUpperCase();
          const clientInfoMatch = pathUpper.match(/CLIENT_INFO\/([^\/]+)/);
          if (clientInfoMatch) {
            const projectName = clientInfoMatch[1];
            if (projectName === rootUpper) return 1000;
            if (projectName.includes(rootUpper) || rootUpper.includes(projectName)) return 100;
          } else {
            const pathParts = pathUpper.split("/");
            for (const part of pathParts) {
              if (part === rootUpper) return 1000;
            }
          }
          return 0;
        }

        const tree = {};

        for (const fileInfo of fileOrder) {
          const parts = fileInfo.path.split("/");
          let current = tree;
          for (const part of parts) {
            if (!current[part]) current[part] = { _isFolder: true, _children: {}, _files: [] };
            current = current[part]._children;
          }
          if (!current._files) current._files = [];
          current._files.push({ filename: fileInfo.filename, matchCount: fileInfo.matchCount, matches: fileInfo.matches });
        }

        const result = [];
        let fileCount = 0;

        function outputTree(node, depth) {
          const folders = [];
          for (const [name, child] of Object.entries(node)) {
            if (!name.startsWith("_") && child._isFolder) folders.push(name);
          }
          folders.sort();

          for (const name of folders) {
            const child = node[name];
            result.push(indent.repeat(depth) + (showIcons ? "📁 " : "") + name);
            outputTree(child._children, depth + 1);
          }

          if (node._files && node._files.length > 0) {
            for (const fileInfo of node._files) {
              let icon = "";
              if (showIcons) {
                const n = fileInfo.filename;
                if (n.endsWith(".java")) icon = "📄 ";
                else if (n.endsWith(".xml")) icon = "📋 ";
                else if (n.endsWith(".properties")) icon = "⚙️ ";
                else if (n.endsWith(".jsp")) icon = "🌐 ";
                else if (n.endsWith(".js")) icon = "📜 ";
                else if (n.endsWith(".css")) icon = "🎨 ";
                else icon = "📄 ";
              }
              fileCount++;
              const matchInfo = fileInfo.matchCount > 0 ? ` (${fileInfo.matchCount} 個の一致)` : "";
              result.push(indent.repeat(depth) + icon + fileInfo.filename + matchInfo);
              if (fileInfo.matches && fileInfo.matches.length > 0) {
                fileInfo.matches.forEach(m => result.push(indent.repeat(depth + 1) + m));
              }
            }
          }
        }

        outputTree(tree, 0);
        document.getElementById("output").value = result.join("\n");

        const statsBar = document.getElementById("statsBar");
        statsBar.style.display = "block";
        statsBar.textContent = `整形完了: ${fileCount} ファイル, ${result.length} 行`;

        const warningBar = document.getElementById("warningBar");
        const unused = detailList.filter(d => !d._used);
        if (unused.length > 0) {
          const names = unused.map(d => d.filename).slice(0, 5).join(", ");
          const more = unused.length > 5 ? ` 他 ${unused.length - 5} 件` : "";
          warningBar.style.display = "block";
          warningBar.textContent = `警告: 詳細情報がマッチしませんでした: ${names}${more}`;
        } else {
          warningBar.style.display = "none";
        }
      }

      function copyOutput() {
        const output = document.getElementById("output");
        output.select();
        document.execCommand("copy");
        const btn = event.target;
        const orig = btn.textContent;
        btn.textContent = "コピー済み";
        setTimeout(() => { btn.textContent = orig; }, 2000);
      }

      function clearInput(id) { document.getElementById(id).value = ""; }

      function clearAll() {
        ["pathInput", "detailInput", "output"].forEach(id => document.getElementById(id).value = "");
        document.getElementById("statsBar").style.display = "none";
        document.getElementById("warningBar").style.display = "none";
      }
    </script>
  </body>
</html>
