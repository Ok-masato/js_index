<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フォルダ構成図作成</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <link rel="stylesheet" href="cafe-common.css" />
    <style>
        /* ===== Page-specific ===== */
        .guide-box {
            background: var(--warning-bg);
            border-left: 3px solid var(--caramel);
            border-radius: 0 6px 6px 0;
            padding: 14px 18px;
            margin-bottom: 24px;
            font-size: 0.82rem;
            color: var(--coffee);
            line-height: 1.8;
        }
        .guide-box strong {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .guide-box ul { margin: 0; padding-left: 18px; }
        .guide-box li { margin-bottom: 2px; }

        .history-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .history-label {
            font-size: 0.72rem;
            color: var(--muted);
            letter-spacing: 0.06em;
        }
        .history-controls select {
            max-width: 220px;
            font-size: 0.8rem;
            padding: 6px 10px;
        }

        /* ===== Tree output ===== */
        #treeOutputContainer {
            margin-top: 4px;
            padding: 28px;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 8px;
            overflow-x: auto;
            min-height: 100px;
        }

        .tree-container {
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.9;
            color: var(--espresso);
            background: var(--surface);
            font-weight: 600;
        }
        .tree-node {
            position: relative;
            padding-left: 24px;
            white-space: nowrap;
        }
        .tree-node::before {
            content: '';
            position: absolute; left: 0; top: 0; bottom: 0;
            width: 1px; background: var(--border);
        }
        .tree-node:last-child::before { height: 14px; }
        .tree-node::after {
            content: '';
            position: absolute; left: 0; top: 14px;
            width: 18px; height: 1px; background: var(--border);
        }
        .tree-root > .tree-node::before,
        .tree-root > .tree-node::after { display: none; }
        .tree-root > .tree-node { padding-left: 0; }

        .node-content {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: default;
            transition: background 0.15s;
        }
        .node-content:hover { background: var(--input-bg); }

        .folder-toggle {
            cursor: pointer;
            width: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            font-size: 9px;
            color: var(--muted);
        }
        .collapsed .folder-toggle { transform: rotate(-90deg); }
        .collapsed .tree-children { display: none; }

        .node-icon {
            display: flex; align-items: center; justify-content: center;
            width: 20px; font-size: 17px;
        }
        .icon-folder-svg { fill: var(--caramel); width: 16px; height: 16px; }

        .node-memo {
            margin-left: 12px;
            color: var(--muted);
            font-size: 11px;
            font-family: sans-serif;
            border-left: 1px solid var(--border);
            padding-left: 10px;
            font-weight: 400;
        }
        .tree-children { margin-left: 18px; }
    </style>
</head>
<body>
    <nav class="page-nav">
      <a class="page-nav__back" href="index.html">Tools</a>
    </nav>

    <div class="page-header">
      <h1 class="page-header__title">フォルダ構成図作成</h1>
      <p class="page-header__subtitle">Tree Visualizer</p>
      <div class="page-header__divider"></div>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const FOLDER_SVG = (
            <svg className="icon-folder-svg" viewBox="0 0 24 24">
                <path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
            </svg>
        );

        const STORAGE_KEY = 'tree_visualizer_last_input';
        const HISTORY_KEY = 'tree_visualizer_history';

        const getIcon = (name, isFolder) => {
            if (isFolder) return <span>{FOLDER_SVG}</span>;
            const ext = name.split('.').pop().toLowerCase();
            const devicons = {
                'js': 'devicon-javascript-plain colored', 'ts': 'devicon-typescript-plain colored',
                'py': 'devicon-python-plain colored', 'java': 'devicon-java-plain colored',
                'cpp': 'devicon-cplusplus-plain colored', 'c': 'devicon-c-plain colored',
                'css': 'devicon-css3-plain colored', 'go': 'devicon-go-original-wordmark colored',
                'php': 'devicon-php-plain colored', 'rb': 'devicon-ruby-plain colored',
                'rs': 'devicon-rust-plain colored', 'swift': 'devicon-swift-plain colored',
                'json': 'devicon-json-plain colored'
            };
            if (devicons[ext]) return <i className={devicons[ext]}></i>;
            if (ext === 'html' || ext === 'htm') return <i className="lab la-html5" style={{color:'#e67e22'}}></i>;
            if (['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp'].includes(ext)) return <i className="las la-image" style={{color:'#5C8A65'}}></i>;
            if (ext === 'pdf') return <i className="las la-file-pdf" style={{color:'#A05050'}}></i>;
            if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return <i className="las la-file-archive" style={{color:'#9B6A38'}}></i>;
            if (ext === 'md' || ext === 'txt') return <i className="las la-file-alt" style={{color:'#9A8070'}}></i>;
            return <i className="las la-file" style={{color:'#9A8070'}}></i>;
        };

        const parseTree = (input) => {
            if (!input.trim()) return [];
            const lines = input.split('\n');
            const rootNodes = [];
            let stack = [];

            lines.forEach(line => {
                if (!line.trim() || line.match(/^\d+ director/)) return;
                const match = line.match(/^([│├└─\s\t]*)(.*)$/);
                if (!match) return;
                const indentStr = match[1].replace(/\t/g, '    ');
                const content = match[2].trim();
                if (!content) return;
                const currentIndentLen = indentStr.length;

                let name = content, memo = "";
                const memoMatch = content.match(/^(.*?)(?:\s+#\s*|\s+\/\/\s*)(.*)$/);
                if (memoMatch) { name = memoMatch[1].trim(); memo = memoMatch[2].trim(); }

                const isFolderByName = !name.includes('.') || name === '.' || name === '..';
                const node = { id: Math.random().toString(36).substr(2, 9), name, memo, children: [], isFolder: isFolderByName };

                if (stack.length === 0 || currentIndentLen === 0) {
                    rootNodes.push(node);
                    stack = [{ len: currentIndentLen, node }];
                } else {
                    while (stack.length > 0 && stack[stack.length - 1].len >= currentIndentLen) stack.pop();
                    if (stack.length > 0) {
                        const parentObj = stack[stack.length - 1];
                        parentObj.node.children.push(node);
                        parentObj.node.isFolder = true;
                        stack.push({ len: currentIndentLen, node });
                    } else {
                        rootNodes.push(node);
                        stack = [{ len: currentIndentLen, node }];
                    }
                }
            });
            return rootNodes;
        };

        const buildTextTree = (nodes, indent = "") => {
            let result = "";
            nodes.forEach((node, index) => {
                const isLast = index === nodes.length - 1;
                result += indent + (isLast ? "└── " : "├── ") + node.name + (node.memo ? " # " + node.memo : "") + "\n";
                if (node.children.length > 0) {
                    result += buildTextTree(node.children, indent + (isLast ? "    " : "│   "));
                }
            });
            return result;
        };

        const TreeNode = ({ node }) => {
            const [isCollapsed, setIsCollapsed] = useState(false);
            const hasChildren = node.children && node.children.length > 0;
            return (
                <div className={`tree-node ${isCollapsed ? 'collapsed' : ''}`}>
                    <div className="node-content">
                        {node.isFolder ? (
                            <span className="folder-toggle" onClick={(e) => { e.stopPropagation(); setIsCollapsed(!isCollapsed); }}>
                                {hasChildren ? '▼' : ' '}
                            </span>
                        ) : (
                            <span style={{ width: '12px' }}></span>
                        )}
                        <span className="node-icon">{getIcon(node.name, node.isFolder)}</span>
                        <span className="node-name">{node.name}</span>
                        {node.memo && <span className="node-memo">{node.memo}</span>}
                    </div>
                    {hasChildren && (
                        <div className="tree-children">
                            {node.children.map((child, idx) => (
                                <TreeNode key={child.id} node={child} isLast={idx === node.children.length - 1} />
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [input, setInput] = useState('');
            const [history, setHistory] = useState([]);
            const [treeData, setTreeData] = useState([]);
            const [toast, setToast] = useState({ message: '', visible: false });
            const [isDragOver, setIsDragOver] = useState(false);
            const treeRef = useRef(null);

            useEffect(() => {
                const savedInput = localStorage.getItem(STORAGE_KEY);
                const savedHistory = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
                setHistory(savedHistory);
                const initialInput = savedInput || `.
├── src # ソースコード
│ ├── components // UI コンポーネント
│ │ └── Header.js # ヘッダー
│ │ └── style.css # スタイル
│ ├── index.html # メイン
│ └── api.py # バックエンド
└── README.md # 説明書`;
                setInput(initialInput);
                setTreeData(parseTree(initialInput));
            }, []);

            const showToast = (message) => {
                setToast({ message, visible: true });
                setTimeout(() => setToast({ message: '', visible: false }), 2000);
            };

            const handleVisualize = useCallback(() => {
                const newTree = parseTree(input);
                setTreeData(newTree);
                localStorage.setItem(STORAGE_KEY, input);
                if (input.trim()) {
                    setHistory(prev => {
                        if (prev[0] === input) return prev;
                        const newHistory = [input, ...prev.filter(h => h !== input)].slice(0, 10);
                        localStorage.setItem(HISTORY_KEY, JSON.stringify(newHistory));
                        return newHistory;
                    });
                }
            }, [input]);

            const handleLoadHistory = (idx) => {
                if (idx === "") return;
                const selected = history[idx];
                if (selected) { setInput(selected); setTreeData(parseTree(selected)); }
            };

            const handleCopyMarkdown = () => {
                const text = buildTextTree(treeData);
                navigator.clipboard.writeText('```\n' + text + '\n```')
                    .then(() => showToast('Markdown をコピーしました'));
            };

            const handleCopyPNG = () => {
                if (!treeRef.current) return;
                html2canvas(treeRef.current, { backgroundColor: '#FFFDF7', scale: 2 }).then(canvas => {
                    canvas.toBlob(blob => {
                        const item = new ClipboardItem({ "image/png": blob });
                        navigator.clipboard.write([item])
                            .then(() => showToast('画像をコピーしました'))
                            .catch(() => showToast('画像のコピーに失敗しました'));
                    });
                });
            };

            const handleDownloadPNG = () => {
                html2canvas(treeRef.current, { backgroundColor: '#FFFDF7', scale: 2 }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'folder-tree.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                });
            };

            const handleDownloadMarkdown = () => {
                const text = buildTextTree(treeData);
                const blob = new Blob(['```\n' + text + '\n```'], { type: 'text/markdown' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'folder-tree.md';
                link.click();
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragOver(false);
                const file = e.dataTransfer.files[0];
                if (file && (file.type.startsWith('text/') || file.name.endsWith('.txt') || file.name.endsWith('.md'))) {
                    const reader = new FileReader();
                    reader.onload = (ev) => { setInput(ev.target.result); setTreeData(parseTree(ev.target.result)); };
                    reader.readAsText(file);
                }
            };

            return (
                <div className="container">
                    <div className="guide-box">
                        <strong>使い方ガイド</strong>
                        <ul>
                            <li><strong>生成:</strong> <code>tree</code> コマンドの結果を貼り付け、Generate Tree を押します。</li>
                            <li><strong>メモ:</strong> <code>#</code> や <code>//</code> で説明を追加できます。</li>
                            <li><strong>履歴:</strong> 過去 10 件の入力を自動保存します。</li>
                            <li><strong>出力:</strong> PNG 画像や Markdown 形式での保存・コピーが可能です。</li>
                            <li><strong>操作:</strong> フォルダ名クリックで階層を開閉できます。</li>
                        </ul>
                    </div>

                    <div className="card-section">
                        <div className="history-controls">
                            <span className="history-label">履歴から読み込む:</span>
                            <select onChange={(e) => handleLoadHistory(e.target.value)}>
                                <option value="">— 過去の入力を選択 —</option>
                                {history.map((h, i) => (
                                    <option key={i} value={i}>
                                        {`[${i+1}] ${h.split('\n')[0].substring(0, 30)}...`}
                                    </option>
                                ))}
                            </select>
                        </div>
                        <textarea
                            value={input}
                            onChange={(e) => setInput(e.target.value)}
                            onDragOver={(e) => { e.preventDefault(); setIsDragOver(true); }}
                            onDragLeave={() => setIsDragOver(false)}
                            onDrop={handleDrop}
                            style={{ borderColor: isDragOver ? 'var(--success)' : undefined, background: isDragOver ? 'var(--success-bg)' : undefined }}
                            placeholder="ここに tree コマンドの結果を貼り付けるか、ファイルをドロップしてください..."
                        />
                        <div className="controls">
                            <button className="btn-primary" style={{ width: 'auto', margin: 0 }} onClick={handleVisualize}>
                                Generate Tree
                            </button>
                            <div className="button-group">
                                <button className="btn-secondary" onClick={handleCopyPNG}>Copy PNG</button>
                                <button className="btn-secondary" onClick={handleCopyMarkdown}>Copy Markdown</button>
                                <button className="btn-secondary" onClick={handleDownloadPNG}>PNG</button>
                                <button className="btn-secondary" onClick={handleDownloadMarkdown}>Markdown</button>
                            </div>
                        </div>
                    </div>

                    <div id="treeOutputContainer" ref={treeRef}>
                        <div className="tree-container tree-root">
                            {treeData.map((node, idx) => (
                                <TreeNode key={node.id} node={node} isLast={idx === treeData.length - 1} />
                            ))}
                        </div>
                    </div>

                    <div className={`toast ${toast.visible ? 'visible' : ''}`}>
                        {toast.message}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
