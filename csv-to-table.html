<!DOCTYPE html>
<html lang="ja">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSV → Table 変換</title>
    <link rel="stylesheet" href="cafe-common.css" />
  </head>

  <body>
    <nav class="page-nav">
      <a class="page-nav__back" href="index.html">Tools</a>
    </nav>

    <div class="page-header">
      <h1 class="page-header__title">CSV → Table 変換</h1>
      <p class="page-header__subtitle">Markdown / Backlog 形式へ変換</p>
      <div class="page-header__divider"></div>
    </div>

    <div class="container">
      <div class="card-section">
        <div class="section-title">Input</div>

        <div class="form-group">
          <label for="csvFile">CSV ファイル</label>
          <input type="file" id="csvFile" accept=".csv" />
        </div>

        <div class="form-group">
          <label>出力形式</label>
          <div class="radio-group">
            <label><input type="radio" name="format" value="markdown" checked> Markdown</label>
            <label><input type="radio" name="format" value="backlog"> Backlog</label>
          </div>
        </div>

        <div style="display:flex; gap:10px;">
          <button class="btn-primary" id="convertBtn" style="flex:1;">変換する</button>
          <button class="btn-secondary" id="downloadBtn" style="display:none; margin-top:16px;">ダウンロード</button>
        </div>
      </div>

      <div class="card-section">
        <div class="section-title">Output</div>
        <textarea id="output" class="output-field" style="min-height:360px;" readonly></textarea>
      </div>
    </div>

    <script>
      document.getElementById("convertBtn").addEventListener("click", async () => {
        const fileInput = document.getElementById("csvFile");
        const output = document.getElementById("output");
        const downloadBtn = document.getElementById("downloadBtn");
        const format = document.querySelector('input[name="format"]:checked').value;

        if (!fileInput.files.length) {
          alert("CSV ファイルを選択してください。");
          return;
        }

        const file = fileInput.files[0];
        const arrayBuffer = await file.arrayBuffer();
        const decoder = new TextDecoder("shift-jis");
        const text = decoder.decode(arrayBuffer);
        const delimiter = text.includes("\t") ? "\t" : ",";

        let rows = text
          .trim()
          .split(/\r?\n/)
          .map((line) => line.split(delimiter));

        if (rows.length > 0 && rows[0][0].replace(/^"|"$/g, "").trim() === "CLIENT_NO") {
          rows.shift();
        }

        const cleanRows = rows.map((row) =>
          row.map((cell) => {
            const trimmed = cell.trim();
            if (trimmed === "") return "null";
            return trimmed.replace(/^"|"$/g, "");
          })
        );

        if (cleanRows.length === 0) return;

        const headers = cleanRows[0];
        const dataRows = cleanRows.slice(1);
        let result = "";

        if (format === "markdown") {
          result += `| ${headers.join(" | ")} |\n`;
          result += `|${headers.map(() => "---").join("|")}|\n`;
          dataRows.forEach((row) => {
            result += `| ${row.join(" | ")} |\n`;
          });
        } else {
          result += `| ${headers.join(" | ")} |h\n`;
          dataRows.forEach((row) => {
            result += `| ${row.join(" | ")} |\n`;
          });
        }

        output.value = result;
        downloadBtn.style.display = "inline-flex";
      });

      document.getElementById("downloadBtn").addEventListener("click", () => {
        const text = document.getElementById("output").value;
        const format = document.querySelector('input[name="format"]:checked').value;
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `output_${format}.txt`;
        link.click();
      });
    </script>
  </body>

</html>
