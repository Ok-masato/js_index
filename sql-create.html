<!DOCTYPE html>
<html lang="ja">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>データ移行 SQL 作成</title>
    <link rel="stylesheet" href="cafe-common.css" />
  </head>

  <body>
    <nav class="page-nav">
      <a class="page-nav__back" href="index.html">Tools</a>
    </nav>

    <div class="page-header">
      <h1 class="page-header__title">データ移行 SQL 作成</h1>
      <p class="page-header__subtitle">CSV → INSERT / UPDATE Generator</p>
      <div class="page-header__divider"></div>
    </div>

    <div class="container">
      <div class="card-section">
        <div class="section-title">Settings</div>

        <div class="form-group">
          <label for="tableName">テーブル名</label>
          <input type="text" id="tableName" placeholder="例: hanpukai_course">
        </div>

        <div class="form-group">
          <label>生成する SQL の種類</label>
          <div class="radio-group">
            <label><input type="radio" name="sqlType" value="UPDATE" checked> UPDATE 文</label>
            <label><input type="radio" name="sqlType" value="INSERT"> INSERT 文</label>
          </div>
        </div>

        <div class="form-group">
          <label for="csvFile">CSV ファイル（Shift-JIS）</label>
          <input type="file" id="csvFile" accept=".csv">
        </div>

        <button class="btn-primary" onclick="generateSql()">SQL を生成する</button>
      </div>

      <div class="card-section">
        <div class="section-title">Output</div>
        <textarea id="output" class="output-field" style="min-height: 360px;" readonly placeholder="ここに生成された SQL が表示されます..."></textarea>
      </div>
    </div>

    <script>
      function parseCSV(text) {
        const result = [];
        let row = [];
        let cell = '';
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
          const char = text[i];
          const nextChar = text[i + 1];

          if (inQuotes) {
            if (char === '"' && nextChar === '"') {
              cell += '"';
              i++;
            } else if (char === '"') {
              inQuotes = false;
            } else {
              cell += char;
            }
          } else {
            if (char === '"') {
              inQuotes = true;
            } else if (char === ',') {
              row.push(cell);
              cell = '';
            } else if (char === '\n' || (char === '\r' && nextChar === '\n')) {
              row.push(cell);
              result.push(row);
              row = [];
              cell = '';
              if (char === '\r') i++;
            } else {
              cell += char;
            }
          }
        }
        if (cell || row.length > 0) {
          row.push(cell);
          result.push(row);
        }
        return result;
      }

      function generateSql() {
        const tableName = document.getElementById('tableName').value.trim();
        const fileInput = document.getElementById('csvFile');
        const output = document.getElementById('output');
        const sqlType = document.querySelector('input[name="sqlType"]:checked').value;

        if (!tableName) {
          alert('テーブル名を入力してください。');
          return;
        }
        if (fileInput.files.length === 0) {
          alert('CSV ファイルを選択してください。');
          return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = function (e) {
          const text = e.target.result;
          const rows = parseCSV(text);

          if (rows.length < 2) {
            alert('データが不足しています。');
            return;
          }

          let headerIndex = 0;
          let maxCols = 0;
          for (let i = 0; i < Math.min(5, rows.length); i++) {
            if (rows[i].length > maxCols) {
              maxCols = rows[i].length;
              headerIndex = i;
            }
          }

          const headers = rows[headerIndex].map(h => h.trim());
          let sqlStatements = [];

          for (let i = headerIndex + 1; i < rows.length; i++) {
            const row = rows[i];
            if (row.length === 0 || (row.length === 1 && row[0].trim() === '')) continue;

            let setClauses = [];
            let valueClauses = [];

            for (let j = 0; j < headers.length; j++) {
              const colName = headers[j];
              if (!colName) continue;

              let value = row[j];
              let formattedValue = '';

              if (value === undefined || value === '') {
                formattedValue = 'null';
              } else {
                const escaped = value.replace(/'/g, "''");
                formattedValue = `'${escaped}'`;
              }

              setClauses.push(`${colName}=${formattedValue}`);
              valueClauses.push(formattedValue);
            }

            if (sqlType === 'UPDATE') {
              sqlStatements.push(`update ${tableName} set ${setClauses.join(', ')}`);
              sqlStatements.push('/');
            } else {
              sqlStatements.push(`insert into ${tableName} (${headers.join(', ')}) values (${valueClauses.join(', ')})`);
              sqlStatements.push('/');
            }
          }

          output.value = sqlStatements.join('\n');
        };

        reader.readAsText(file, 'Shift_JIS');
      }
    </script>
  </body>

</html>
